name: Build and Deploy (GHCR + webhook)

# Fase 6 — SELLGRAM-LXC-DOCKER-MIGRATION
#
# Alur:
#   1. build image linux/amd64 dari Dockerfile repo ini
#   2. push ke GHCR: ghcr.io/<owner>/<repo>:sha-<full sha>  +  :latest
#   3. panggil webhook di lxc-6 (adnanh) -> /opt/deploy/deploy.sh fe
#      lxc-6 yang melakukan `docker compose pull` + `up -d` + health check 40 s
#      + rollback ke tag sebelumnya bila gagal. Balasan harus memuat DEPLOY_OK.
#
# Build TIDAK dilakukan di lxc-6 (RAM host hanya 3,8 GiB — lihat T10).
# `NEXT_PUBLIC_*` tertanam saat build, jadi ubah nilainya = push + rebuild image.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Jangan pernah dua deploy FE berjalan bersamaan (webhook pun punya flock).
concurrency:
  group: deploy-fe-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tefa-stemanika/sellgram-fe
  NEXT_PUBLIC_API_URL: https://sellgram-api.coreapps.web.id
  NEXT_PUBLIC_SITE_URL: https://sellgram.coreapps.web.id

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=sellgram-fe
          cache-to: type=gha,mode=max,scope=sellgram-fe

      - name: Trigger deploy webhook (lxc-6)
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Secret DEPLOY_URL / DEPLOY_TOKEN belum diisi di repo ini."
            exit 1
          fi
          RESP=$(curl -sS --max-time 300 -X POST "$DEPLOY_URL" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"service\":\"fe\",\"sha\":\"${GITHUB_SHA}\"}")
          echo "$RESP"
          echo "$RESP" | grep -q "DEPLOY_OK"

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Deploy FE"
            echo "- Image: \`${IMAGE}:sha-${GITHUB_SHA}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Service: \`fe\`"
            echo "- Status job: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
