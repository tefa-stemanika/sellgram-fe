name: Build and Deploy (LXC)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://sellgram-api.coreapps.web.id
      NEXT_PUBLIC_SITE_URL: https://sellgram.coreapps.web.id
      NEXT_TELEMETRY_DISABLED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          npm run build

      - name: Package standalone
        run: |
          mkdir pkg
          cp -r .next/standalone/. pkg/
          mkdir -p pkg/.next
          cp -r .next/static pkg/.next/static
          [ -d public ] && cp -r public pkg/public || true
          tar -czf release.tar.gz -C pkg .

      - name: Publish release asset
        run: |
          gh release create "deploy-${GITHUB_SHA}" release.tar.gz \
            --title "deploy ${GITHUB_SHA}" --notes "auto deploy" --target "${GITHUB_SHA}" || true

      - name: Trigger deploy webhook
        run: |
          RESP=$(curl -sS --max-time 120 -X POST "${{ secrets.DEPLOY_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${GITHUB_SHA}\"}")
          echo "$RESP"
          echo "$RESP" | grep -q "DEPLOY_OK"

      - name: Prune old releases (keep 5)
        if: always()
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^deploy-' | tail -n +6 \
            | xargs -r -I{} gh release delete {} --cleanup-tag -y || true
