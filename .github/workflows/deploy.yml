name: Build & Deploy (CapRover)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://sellgram-api.coreapps.web.id
            NEXT_PUBLIC_SITE_URL=https://sellgram.coreapps.web.id
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to CapRover (pull image via API)
        env:
          SERVER: ${{ secrets.CAPROVER_SERVER }}
          PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          APP_NAME: sellgram
        run: |
          set -e
          TOKEN=$(curl -fsS -X POST "$SERVER/api/v2/login/" \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"$PASSWORD\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['token'])")
          curl -fsS -X POST "$SERVER/api/v2/user/apps/appData/$APP_NAME/" \
            -H "x-captain-auth: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"captainDefinitionContent\":\"{\\\"schemaVersion\\\":2,\\\"imageName\\\":\\\"${{ env.IMAGE }}:latest\\\"}\",\"gitHash\":\"\"}"
